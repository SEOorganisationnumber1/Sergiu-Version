    <meta name="theme-color" content="#e9eef2" />
    <script>
      let savedTheme = null;
      try { savedTheme = localStorage.getItem('nxt_theme_override'); } catch {}
      const prefersDark = savedTheme === 'dark' || (savedTheme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', prefersDark);
      document.querySelector('meta[name="theme-color"]')?.setAttribute('content', prefersDark ? '#080c12' : '#e9eef2');
    </script>
    <meta name="description" content="NXT/STUDIO builds high-performance digital experiences through technical SEO, AEO, GEO, bespoke design and scalable full-stack architecture." />
